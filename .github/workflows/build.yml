name: Build Leonard

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
      contents: read
    env:
      # 'x-gha' was removed from vcpkg. Use the built-in 'files' backend and let
      # actions/cache persist the directory between runs; this needs no token,
      # no NuGet feed and works identically on Windows and macOS runners.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-
      
      - name: Validate release version (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/version.py

      - name: Validate release version (Windows)
        if: runner.os == 'Windows'
        run: python scripts/version.py

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          # Cache the vcpkg tool and its ports (the action does not do so by default).
          doNotCache: false

      - name: Configure CMake
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Generate third-party notices (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 scripts/generate_third_party_notices.py \
            --vcpkg-root build/vcpkg_installed \
            --output THIRD_PARTY_NOTICES.txt

      - name: Generate third-party notices (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/generate_third_party_notices.py `
            --vcpkg-root build/vcpkg_installed `
            --output build/Release/THIRD_PARTY_NOTICES.txt

      - name: Package macOS Droplet
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/mac/package_mac.sh
          ./scripts/mac/package_mac.sh build

      - name: Upload Artifact (macOS Droplet)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Leonard-macOS
          path: Leonard-macOS.zip
          if-no-files-found: error

      - name: Package Windows Droplet
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python scripts/version.py
          $shortVersion = python scripts/version.py --print short-version
          Copy-Item -Path "scripts/windows/Leonard.cmd" -Destination "build/Release/" -Force
          Get-ChildItem -Path "${{ github.workspace }}/build/vcpkg_installed" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "build/Release" -Force -ErrorAction SilentlyContinue
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (Test-Path $isccPath) {
              & $isccPath "/DMyAppVersion=$version" "/DMyAppNumericVersion=$shortVersion" "scripts/windows/installer.iss"
          } elseif (Get-Command iscc -ErrorAction SilentlyContinue) {
              iscc "/DMyAppVersion=$version" "/DMyAppNumericVersion=$shortVersion" "scripts/windows/installer.iss"
          } else {
              Write-Host "Inno Setup not detected on runner; skipping installer compilation."
          }
          Compress-Archive -Path "build/Release/*" -DestinationPath "Leonard-Windows-Portable.zip" -Force

      - name: Upload Artifact (Windows Portable Droplet)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Leonard-Windows-Portable
          path: Leonard-Windows-Portable.zip
          if-no-files-found: error

      - name: Upload Artifact (Windows Setup Installer)
        if: runner.os == 'Windows' && hashFiles('dist/Leonard-Setup-x64.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Leonard-Windows-Setup
          path: dist/Leonard-Setup-x64.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download macOS package
        uses: actions/download-artifact@v4.1.3
        with:
          name: Leonard-macOS
          path: release-assets

      - name: Download Windows portable package
        uses: actions/download-artifact@v4.1.3
        with:
          name: Leonard-Windows-Portable
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v4.1.3
        with:
          name: Leonard-Windows-Setup
          path: release-assets

      - name: Generate and verify release checksums
        working-directory: release-assets
        shell: bash
        run: |
          for asset in Leonard-macOS.zip Leonard-Windows-Portable.zip Leonard-Setup-x64.exe; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing required release asset: $asset"
              exit 1
            fi
          done
          sha256sum -- Leonard-Setup-x64.exe Leonard-Windows-Portable.zip Leonard-macOS.zip > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Leonard-macOS.zip
            release-assets/Leonard-Windows-Portable.zip
            release-assets/Leonard-Setup-x64.exe
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
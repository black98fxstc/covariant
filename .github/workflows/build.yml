name: Build Leonard

on:
  # push:
  #   branches: [ "main", "master" ]
  # pull_request:
  #   branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          simd_flag: "/arch:AVX2"
          name: windows-x64
        - os: macos-latest
          simd_flag: ""               # ARM64 enables NEON by default for Apple Silicon
          name: macos-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install macOS build tools
      if: runner.os == 'macOS'
      run: brew install autoconf automake libtool

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'

    - name: Configure CMake
      run: >
        cmake -B build -S . 
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_CXX_FLAGS="${{ matrix.simd_flag }}"

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: leonard-windows
        path: build/Release/leonard.exe # MSVC puts it in a Release subfolder by default

    - name: Upload Artifact (macOS/Linux)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: leonard-${{ runner.os }}
        path: build/leonard # Unix usually outputs directly to the build folder